version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: property_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  zipkin: # For distributed tracing (Standard #10)
    image: openzipkin/zipkin
    ports:
      - "9411:9411"

volumes:
  postgres_data: