spring.application.name=property-core

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/property_db}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.platform-admin.allowed-emails=${PLATFORM_ADMIN_EMAILS:}
app.platform-admin.bootstrap-token=${PLATFORM_ADMIN_BOOTSTRAP_TOKEN:}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

app.jwt.issuer=${JWT_ISSUER:https://property-core.local}
# JWT_SECRET must be set via environment variable in production.
# This fallback is for development only - DO NOT use in production!
# Minimum length: 32 bytes (256 bits) for HMAC-SHA256
app.jwt.secret=${JWT_SECRET:ZGV2LW9ubHktc3VwZXItc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi0zMi1ieXRlcw==}
app.jwt.access-token-ttl-seconds=${JWT_ACCESS_TOKEN_TTL_SECONDS:3600}
